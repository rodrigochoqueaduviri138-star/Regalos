<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Para la conejita más linda 🌻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    touch-action: none;
  }
  #canvas-container { position: fixed; inset: 0; z-index: 1; }

  /* === TEXTO SUPERIOR === */
  #titulo {
    position: fixed;
    top: 18px; left: 0; right: 0;
    text-align: center;
    padding: 0 14px;
    color: #fff36b;
    font-size: clamp(15px, 3.4vw, 26px);
    font-weight: 700;
    line-height: 1.25;
    letter-spacing: 0.5px;
    text-shadow:
      0 0 8px  #ffee55,
      0 0 18px #ffcc00,
      0 0 34px #ff9900,
      0 0 60px rgba(255, 150, 0, 0.7);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  #titulo.visible { opacity: 1; }

  /* === TEXTO INFERIOR === */
  #subtitulo {
    position: fixed;
    bottom: 22px; left: 0; right: 0;
    text-align: center;
    padding: 0 14px;
    color: #fff36b;
    font-size: clamp(15px, 3.4vw, 26px);
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow:
      0 0 8px  #ffee55,
      0 0 18px #ffcc00,
      0 0 34px #ff9900,
      0 0 60px rgba(255, 150, 0, 0.7);
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.6s ease;
  }
  #subtitulo.visible { opacity: 1; }

  #ayuda {
    position: fixed;
    bottom: 4px; left: 0; right: 0;
    text-align: center;
    color: #ffd54a;
    font-size: 10px;
    opacity: 0.35;
    z-index: 10;
    pointer-events: none;
  }

  #overlay {
    position: fixed; inset: 0;
    background: #000;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1s ease;
  }
  #overlay.oculto { opacity: 0; pointer-events: none; }

  #girasol-icon {
    font-size: 90px;
    animation: latido 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255, 200, 0, 0.9));
  }
  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.18); }
  }
  #texto-inicio {
    margin-top: 26px;
    color: #ffd54a;
    font-size: 20px;
    letter-spacing: 2px;
    text-shadow: 0 0 14px rgba(255, 213, 74, 0.8);
    animation: parpadeo 2s ease-in-out infinite;
  }
  @keyframes parpadeo {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .frase {
    position: fixed;
    color: #fff8d6;
    font-size: clamp(11px, 1.8vw, 15px);
    font-weight: 500;
    text-shadow: 0 0 12px rgba(255, 213, 74, 0.9), 0 0 24px rgba(255, 160, 0, 0.6);
    pointer-events: none;
    z-index: 5;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  /* === FRASE DENTRO DEL CORAZÓN === */
  #frase-corazon {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: #4a0030;
    font-size: 30px;                       /* valor por defecto; JS lo ajusta */
    font-weight: 900;
    letter-spacing: 0.02em;
    padding: 0;
    max-width: 60vw;
    line-height: 1.15;
    pointer-events: none;
    z-index: 7;
    font-family: 'Segoe UI', Tahoma, sans-serif;

    /* Borde neón en em para que escale con el texto */
    -webkit-text-stroke: 0.045em #ff00aa;
    paint-order: stroke fill;

    text-shadow:
      0 0 0.15em #ffffff,
      0 0 0.35em #ff33cc,
      0 0 0.7em  #ff00aa,
      0 0 1.2em  #ff0099,
      0 0 2.2em  rgba(255, 0, 180, 0.7);

    opacity: 0;
    transition: opacity 0.9s ease;
    will-change: font-size, left, top;
  }
  #frase-corazon.visible { opacity: 1; }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="titulo">Para la conejita mas linda del mundo,<br>nunca dejes de ser tu</div>

<div id="subtitulo">Te amo princesa conejita, soy tu michi Rodrigo</div>

<div id="frase-corazon">Soy tu michi conejita</div>

<div id="ayuda">Arrastra para rotar · Rueda / pinza para zoom · Dos dedos para desplazar</div>

<div id="overlay">
  <div id="girasol-icon">🌻</div>
  <div id="texto-inicio">Toca para iniciar</div>
</div>

<audio id="musica1" src="cancion1.mp3" preload="auto"></audio>
<audio id="musica2" src="cancion2.mp3" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  'use strict';

  // ============================================================
  //  CONFIGURACIÓN
  // ============================================================
  const NUM_ESTRELLAS   = 2400;
  const RADIO_GALAXIA   = 62;
  const NUM_GIRASOLES   = 45;

  const FRASES = [
    "Los girasoles siempre buscan la luz 🌻",
    "Gracias por ser esa flor amarilla en mi vida",
    "El amor florece como un girasol",
    "Feliz Día de las Flores Amarillas",
    "Un detalle amarillo puede alegrar todo un día",
    "Como el girasol, siempre mira hacia adelante",
    "Te amo Aneliz",
    "Se que no soy perfecto pero sigo luchando por ti",
    "Siempre confia en ti",
    "Mi conejita licenciada",
    "El osito y yo estamos orgullosos de ti",
    "Eres un sueño echo realidad"
  ];

  const FRASES_CORAZON = [
    "Soy tu michi conejita",
    "Te pienso siempre Aneliz",
    "Juntos por siempre",
    "El osito esta celoso"
  ];

  const FOTOS = [
    "foto1.jpg",
    "foto2.jpg",
    "foto3.jpg",
    "foto4.jpg",
    "foto5.jpg",
    "foto6.jpg"
  ];

  // ============================================================
  //  ESCENA / CÁMARA / RENDER
  // ============================================================
  const contenedor = document.getElementById('canvas-container');

  const escena = new THREE.Scene();
  escena.fog = new THREE.FogExp2(0x000000, 0.008);

  const camara = new THREE.PerspectiveCamera(
    65,
    window.innerWidth / window.innerHeight,
    0.1,
    3000
  );
  camara.position.set(0, 22, 65);
  camara.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000, 1);
  contenedor.appendChild(renderer.domElement);

  // ============================================================
  //  ORBIT CONTROLS
  // ============================================================
  const controls = new THREE.OrbitControls(camara, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.07;
  controls.rotateSpeed = 0.55;
  controls.zoomSpeed = 0.9;
  controls.panSpeed = 0.7;
  controls.enablePan = true;
  controls.screenSpacePanning = true;
  controls.minDistance = 6;
  controls.maxDistance = 240;
  controls.target.set(0, 0, 0);
  controls.update();

  // ============================================================
  //  LUCES
  // ============================================================
  escena.add(new THREE.AmbientLight(0xffffff, 0.7));

  const luzDorada = new THREE.PointLight(0xffcc33, 3.2, 160, 2);
  luzDorada.position.set(0, 0, 0);
  escena.add(luzDorada);

  const luzExterior = new THREE.PointLight(0xffaa00, 1.4, 260, 2);
  luzExterior.position.set(30, 40, 30);
  escena.add(luzExterior);

  const luzRosa = new THREE.PointLight(0xff66aa, 2.2, 100, 2);
  luzRosa.position.set(0, 0, 6);
  escena.add(luzRosa);

  // ============================================================
  //  CORAZÓN ROSA PASTEL CON BORDES NEÓN
  // ============================================================
  function crearFormaCorazon(escala) {
    const puntos = [];
    const N = 100;
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t)
              - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t)
              - Math.cos(4 * t);
      puntos.push(new THREE.Vector2(x * escala, y * escala));
    }
    return new THREE.Shape(puntos);
  }

  const formaCorazon = crearFormaCorazon(0.34);
  const geoCorazon = new THREE.ExtrudeGeometry(formaCorazon, {
    depth: 2.8,
    bevelEnabled: true,
    bevelThickness: 0.6,
    bevelSize: 0.6,
    bevelSegments: 10,
    curveSegments: 28
  });
  geoCorazon.center();

  const matCorazon = new THREE.MeshStandardMaterial({
    color: 0xffb6d9,
    emissive: 0xff4d99,
    emissiveIntensity: 0.35,
    metalness: 0.15,
    roughness: 0.55
  });

  const corazon = new THREE.Mesh(geoCorazon, matCorazon);
  corazon.scale.setScalar(1.35);
  escena.add(corazon);

  const matNeonBorde = new THREE.MeshBasicMaterial({
    color: 0xff00cc,
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.BackSide
  });
  const corazonNeon = new THREE.Mesh(geoCorazon, matNeonBorde);
  corazonNeon.scale.setScalar(1.35 * 1.18);
  escena.add(corazonNeon);

  const geoEdges = new THREE.EdgesGeometry(geoCorazon, 25);
  const matEdges = new THREE.LineBasicMaterial({
    color: 0xff33dd,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending
  });
  const corazonEdges = new THREE.LineSegments(geoEdges, matEdges);
  corazonEdges.scale.setScalar(1.35 * 1.02);
  escena.add(corazonEdges);

  const resplandorCorazon = (function () {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0.0, 'rgba(255, 180, 220, 0.9)');
    g.addColorStop(0.4, 'rgba(255, 80, 180, 0.45)');
    g.addColorStop(1.0, 'rgba(255, 0, 140, 0.0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 256);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(c),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    sprite.scale.set(38, 38, 1);
    escena.add(sprite);
    return sprite;
  })();

  // ============================================================
  //  GALAXIA DE PARTÍCULAS
  // ============================================================
  const posiciones = new Float32Array(NUM_ESTRELLAS * 3);
  const colores    = new Float32Array(NUM_ESTRELLAS * 3);
  const cInt = new THREE.Color(0xffdd66);
  const cMed = new THREE.Color(0xffaa22);
  const cExt = new THREE.Color(0x884400);

  for (let i = 0; i < NUM_ESTRELLAS; i++) {
    const i3 = i * 3;
    const ramas = 3;
    const rama = i % ramas;
    const radio = Math.pow(Math.random(), 0.7) * RADIO_GALAXIA;

    const anguloBase = (rama / ramas) * Math.PI * 2;
    const giro = radio * 0.12;
    const dispersion = (1 - radio / RADIO_GALAXIA) * 0.6 + 0.15;
    const angulo = anguloBase + giro + (Math.random() - 0.5) * dispersion;

    posiciones[i3]     = Math.cos(angulo) * radio + (Math.random() - 0.5) * 2.5;
    posiciones[i3 + 1] = (Math.random() - 0.5) * (3 + 8 * (1 - radio / RADIO_GALAXIA));
    posiciones[i3 + 2] = Math.sin(angulo) * radio + (Math.random() - 0.5) * 2.5;

    const t = radio / RADIO_GALAXIA;
    const col = t < 0.4
      ? cInt.clone().lerp(cMed, t / 0.4)
      : cMed.clone().lerp(cExt, (t - 0.4) / 0.6);
    colores[i3]     = col.r;
    colores[i3 + 1] = col.g;
    colores[i3 + 2] = col.b;
  }

  const geoGalaxia = new THREE.BufferGeometry();
  geoGalaxia.setAttribute('position', new THREE.BufferAttribute(posiciones, 3));
  geoGalaxia.setAttribute('color',    new THREE.BufferAttribute(colores, 3));

  const galaxia = new THREE.Points(geoGalaxia, new THREE.PointsMaterial({
    size: 0.4,
    vertexColors: true,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
  }));
  escena.add(galaxia);

  // ============================================================
  //  TEXTURA DE GIRASOL
  // ============================================================
  function crearTexturaGirasol() {
    const S = 256;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    const cx = S / 2, cy = S / 2;

    const capas = [
      { n: 24, largo: 72, ancho: 12, radio: 20, c1: '#ffe066', c2: '#e69900', off: 0 },
      { n: 20, largo: 64, ancho: 11, radio: 20, c1: '#ffd633', c2: '#cc7700', off: Math.PI / 20 },
      { n: 16, largo: 54, ancho: 10, radio: 20, c1: '#ffb300', c2: '#a85a00', off: Math.PI / 16 }
    ];

    capas.forEach((capa) => {
      for (let i = 0; i < capa.n; i++) {
        const a = (i / capa.n) * Math.PI * 2 + capa.off;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a);
        const grad = ctx.createLinearGradient(0, capa.radio, 0, capa.radio + capa.largo);
        grad.addColorStop(0, capa.c1);
        grad.addColorStop(0.7, capa.c1);
        grad.addColorStop(1, capa.c2);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, capa.radio + capa.largo / 2, capa.ancho / 2, capa.largo / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(160, 90, 0, 0.35)';
        ctx.lineWidth = 0.6;
        ctx.stroke();
        ctx.restore();
      }
    });

    const gradCentro = ctx.createRadialGradient(cx - 5, cy - 5, 3, cx, cy, 26);
    gradCentro.addColorStop(0, '#7a4f1a');
    gradCentro.addColorStop(0.5, '#4a2c0c');
    gradCentro.addColorStop(1, '#1e0f03');
    ctx.fillStyle = gradCentro;
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 200; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 24;
      const x = cx + Math.cos(ang) * r;
      const y = cy + Math.sin(ang) * r;
      const brillo = Math.random();
      ctx.fillStyle = `rgba(${180 + brillo * 75}, ${130 + brillo * 70}, ${40 + brillo * 50}, ${0.5 + brillo * 0.4})`;
      ctx.beginPath();
      ctx.arc(x, y, 0.8 + Math.random() * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    const hg = ctx.createRadialGradient(cx - 8, cy - 8, 0, cx - 8, cy - 8, 22);
    hg.addColorStop(0, 'rgba(255, 220, 150, 0.35)');
    hg.addColorStop(1, 'rgba(255, 220, 150, 0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.fill();

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    return tex;
  }

  const texturaGirasol = crearTexturaGirasol();

  // ============================================================
  //  GIRASOLES
  // ============================================================
  const girasoles = [];

  function crearGirasol() {
    const grupo = new THREE.Group();

    const mat = new THREE.SpriteMaterial({
      map: texturaGirasol,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending
    });
    const sprite = new THREE.Sprite(mat);
    const escala = 1.7 + Math.random() * 1.1;
    sprite.scale.set(escala, escala, 1);
    grupo.add(sprite);

    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
    g.addColorStop(0, 'rgba(255, 220, 80, 0.55)');
    g.addColorStop(1, 'rgba(255, 180, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 128, 128);

    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(c),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    halo.scale.set(escala * 2.2, escala * 2.2, 1);
    grupo.add(halo);

    return grupo;
  }

  for (let i = 0; i < NUM_GIRASOLES; i++) {
    const girasol = crearGirasol();

    const radio = 10 + Math.pow(Math.random(), 0.75) * 16;
    const angulo = Math.random() * Math.PI * 2;
    const inclinacion = (Math.random() - 0.5) * 6;
    const velOrbita = 0.12 + Math.random() * 0.3;
    const velFlot = 0.6 + Math.random() * 0.9;
    const fase = Math.random() * Math.PI * 2;

    girasol.position.set(
      Math.cos(angulo) * radio,
      inclinacion,
      Math.sin(angulo) * radio
    );

    girasol.userData = {
      angulo, radio, inclinacion,
      velOrbita, velFlot, fase,
      yBase: inclinacion
    };

    escena.add(girasol);
    girasoles.push(girasol);
  }

  // ============================================================
  //  FLORES ROSADAS PEQUEÑAS ORBITANDO
  // ============================================================
  function crearTexturaFlorRosa() {
    const S = 128;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    const cx = S / 2, cy = S / 2;

    const capas = [
      { n: 10, largo: 34, ancho: 14, radio: 8,  c1: '#ffd6e8', c2: '#ff8fb8', off: 0 },
      { n: 8,  largo: 30, ancho: 13, radio: 8,  c1: '#ffb3d1', c2: '#ff6fa5', off: Math.PI / 8 },
      { n: 6,  largo: 26, ancho: 12, radio: 8,  c1: '#ff94bd', c2: '#e34d85', off: Math.PI / 6 }
    ];

    capas.forEach((capa) => {
      for (let i = 0; i < capa.n; i++) {
        const a = (i / capa.n) * Math.PI * 2 + capa.off;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(a);
        const grad = ctx.createLinearGradient(0, capa.radio, 0, capa.radio + capa.largo);
        grad.addColorStop(0, capa.c1);
        grad.addColorStop(0.7, capa.c1);
        grad.addColorStop(1, capa.c2);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(0, capa.radio + capa.largo / 2, capa.ancho / 2, capa.largo / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(200, 60, 110, 0.4)';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();
      }
    });

    const gradCentro = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, 12);
    gradCentro.addColorStop(0, '#fff5b8');
    gradCentro.addColorStop(0.6, '#ffd54a');
    gradCentro.addColorStop(1, '#d49000');
    ctx.fillStyle = gradCentro;
    ctx.beginPath();
    ctx.arc(cx, cy, 12, 0, Math.PI * 2);
    ctx.fill();

    for (let i = 0; i < 40; i++) {
      const ang = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * 10;
      ctx.fillStyle = `rgba(180, 120, 0, ${0.4 + Math.random() * 0.4})`;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 8;
    return tex;
  }

  const texturaFlorRosa = crearTexturaFlorRosa();
  const floresRosas = [];
  const NUM_FLORES_ROSAS = 30;

  for (let i = 0; i < NUM_FLORES_ROSAS; i++) {
    const grupo = new THREE.Group();

    const mat = new THREE.SpriteMaterial({
      map: texturaFlorRosa,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const sprite = new THREE.Sprite(mat);
    const escala = 2.4 + Math.random() * 1.2;
    sprite.scale.set(escala, escala, 1);
    grupo.add(sprite);

    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255, 150, 200, 0.45)');
    g.addColorStop(1, 'rgba(255, 100, 160, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 64, 64);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(c),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    halo.scale.set(escala * 2.4, escala * 2.4, 1);
    grupo.add(halo);

    const radio = 9 + Math.pow(Math.random(), 0.7) * 18;
    const angulo = Math.random() * Math.PI * 2;
    const inclinacion = (Math.random() - 0.5) * 8;
    const velOrbita = 0.15 + Math.random() * 0.35;
    const velFlot = 0.5 + Math.random() * 0.9;
    const fase = Math.random() * Math.PI * 2;

    grupo.position.set(
      Math.cos(angulo) * radio,
      inclinacion,
      Math.sin(angulo) * radio
    );

    grupo.userData = {
      angulo, radio, inclinacion,
      velOrbita, velFlot, fase,
      yBase: inclinacion
    };

    escena.add(grupo);
    floresRosas.push(grupo);
  }

  // ============================================================
  //  FOTOS FLOTANTES
  // ============================================================
  const cargador = new THREE.TextureLoader();
  const fotosObjetos = [];

  FOTOS.forEach((url, i) => {
    cargador.load(
      url,
      (textura) => {
        textura.anisotropy = renderer.capabilities.getMaxAnisotropy();
        textura.minFilter = THREE.LinearMipmapLinearFilter;
        textura.magFilter = THREE.LinearFilter;
        textura.generateMipmaps = true;
        if ('colorSpace' in textura) {
          textura.colorSpace = THREE.SRGBColorSpace;
        } else if ('encoding' in textura) {
          textura.encoding = THREE.sRGBEncoding;
        }
        textura.needsUpdate = true;

        const img = textura.image;
        const aspecto = img.width / img.height;

        const ALTO_BASE = 9;
        const ancho = ALTO_BASE * aspecto;
        const alto  = ALTO_BASE;

        const plano = new THREE.Mesh(
          new THREE.PlaneGeometry(ancho, alto),
          new THREE.MeshBasicMaterial({
            map: textura,
            transparent: true,
            opacity: 0.98,
            side: THREE.DoubleSide,
            toneMapped: false
          })
        );

        const marco = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.PlaneGeometry(ancho + 0.15, alto + 0.15)),
          new THREE.LineBasicMaterial({ color: 0xffcc44, transparent: true, opacity: 0.7 })
        );
        plano.add(marco);

        const angulo = (i / FOTOS.length) * Math.PI * 2;
        const radio  = 26 + Math.random() * 8;
        plano.position.set(
          Math.cos(angulo) * radio,
          (Math.random() - 0.5) * 12,
          Math.sin(angulo) * radio
        );

        plano.userData = {
          anguloBase: angulo,
          radio,
          yBase: plano.position.y,
          velY: 0.3 + Math.random() * 0.4,
          faseY: Math.random() * Math.PI * 2
        };

        escena.add(plano);
        fotosObjetos.push(plano);
      },
      undefined,
      () => {}
    );
  });

  // ============================================================
  //  FRASES FLOTANTES (DOM)
  // ============================================================
  const frasesDOM = FRASES.map((texto, i) => {
    const el = document.createElement('div');
    el.className = 'frase';
    el.textContent = texto;
    document.body.appendChild(el);
    return {
      el,
      angulo: (i / FRASES.length) * Math.PI * 2,
      radio: 24 + Math.random() * 10,
      y: (Math.random() - 0.5) * 16,
      velY: 0.25 + Math.random() * 0.4,
      fase: Math.random() * Math.PI * 2
    };
  });

  // ============================================================
  //  INTERACCIÓN INICIAL
  // ============================================================
  let iniciado = false;
  const overlay   = document.getElementById('overlay');
  const titulo    = document.getElementById('titulo');
  const subtitulo = document.getElementById('subtitulo');
  const elFraseCorazon = document.getElementById('frase-corazon');

  // ============================================================
  //  SECUENCIA DE MÚSICA
  // ============================================================
  const DURACIONES = {
    1: 80,
    2: 130
  };
  const VOLUMEN_MUSICA = 0.6;

  const musica1 = document.getElementById('musica1');
  const musica2 = document.getElementById('musica2');
  musica1.volume = VOLUMEN_MUSICA;
  musica2.volume = VOLUMEN_MUSICA;

  let timerCambio = null;

  function reproducirCancion(numero) {
    musica1.pause();
    musica2.pause();
    musica1.currentTime = 0;
    musica2.currentTime = 0;

    const audio = numero === 1 ? musica1 : musica2;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});

    const duracion = DURACIONES[numero] * 1000;
    clearTimeout(timerCambio);
    timerCambio = setTimeout(() => {
      reproducirCancion(numero === 1 ? 2 : 1);
    }, duracion);
  }

  // ============================================================
  //  CAMBIO DE FRASE DENTRO DEL CORAZÓN
  // ============================================================
  let idxFraseCorazon = 0;
  let timerFraseCorazon = null;

  function cambiarFraseCorazon() {
    elFraseCorazon.style.opacity = 0;

    setTimeout(() => {
      idxFraseCorazon = (idxFraseCorazon + 1) % FRASES_CORAZON.length;
      elFraseCorazon.textContent = FRASES_CORAZON[idxFraseCorazon];
      elFraseCorazon.style.opacity = 1;
    }, 900);
  }

  function iniciarFrasesCorazon() {
    elFraseCorazon.textContent = FRASES_CORAZON[0];
    elFraseCorazon.classList.add('visible');
    clearInterval(timerFraseCorazon);
    timerFraseCorazon = setInterval(cambiarFraseCorazon, 4500);
  }

  function iniciar() {
    if (iniciado) return;
    iniciado = true;
    overlay.classList.add('oculto');
    titulo.classList.add('visible');
    subtitulo.classList.add('visible');

    reproducirCancion(1);
    iniciarFrasesCorazon();
  }

  overlay.addEventListener('click', iniciar);
  overlay.addEventListener('touchstart', iniciar, { passive: true });

  // ============================================================
  //  ANIMACIÓN
  // ============================================================
  const reloj = new THREE.Clock();
  const puntoCorazon    = new THREE.Vector3(0, 0, 0);   // centro
  const puntoCorazonTop = new THREE.Vector3(0, 6.5, 0); // parte superior

  function animar() {
    requestAnimationFrame(animar);

    const t = reloj.getElapsedTime();

    if (iniciado) {
      // Galaxia
      galaxia.rotation.y += 0.0012;

      // Corazón late (doble pulso) — escala base 1.35
      const latido = 1 + Math.sin(t * 3.2) * 0.07 + Math.sin(t * 6.4) * 0.035;
      const escalaBase = 1.35;
      corazon.scale.setScalar(escalaBase * latido);
      corazonNeon.scale.setScalar(escalaBase * 1.18 * latido);
      corazonEdges.scale.setScalar(escalaBase * 1.02 * latido);

      // Ligera rotación oscilante sincronizada
      const rotY = Math.sin(t * 0.5) * 0.18;
      corazon.rotation.y = rotY;
      corazonNeon.rotation.y = rotY;
      corazonEdges.rotation.y = rotY;

      // Resplandor pulsa con el corazón
      resplandorCorazon.scale.setScalar(38 * (1 + Math.sin(t * 3.2) * 0.1));

      // Girasoles orbitando
      girasoles.forEach((g) => {
        const d = g.userData;
        d.angulo += d.velOrbita * 0.01;
        g.position.x = Math.cos(d.angulo) * d.radio;
        g.position.z = Math.sin(d.angulo) * d.radio;
        g.position.y = d.yBase + Math.sin(t * d.velFlot + d.fase) * 1.6;
        g.lookAt(camara.position);
      });

      // Flores rosadas orbitando
      floresRosas.forEach((f) => {
        const d = f.userData;
        d.angulo += d.velOrbita * 0.01;
        f.position.x = Math.cos(d.angulo) * d.radio;
        f.position.z = Math.sin(d.angulo) * d.radio;
        f.position.y = d.yBase + Math.sin(t * d.velFlot + d.fase) * 1.6;
        f.lookAt(camara.position);
      });

      // Fotos orbitando
      fotosObjetos.forEach((f) => {
        const d = f.userData;
        d.anguloBase += 0.002;
        f.position.x = Math.cos(d.anguloBase) * d.radio;
        f.position.z = Math.sin(d.anguloBase) * d.radio;
        f.position.y = d.yBase + Math.sin(t * d.velY + d.faseY) * 2;
        f.lookAt(camara.position);
      });

      // Frases orbitando
      frasesDOM.forEach((f) => {
        f.angulo += 0.0015;

        const posMundo = new THREE.Vector3(
          Math.cos(f.angulo) * f.radio,
          f.y + Math.sin(t * f.velY + f.fase) * 2,
          Math.sin(f.angulo) * f.radio
        );

        const dist = camara.position.distanceTo(posMundo);
        const vNDC = posMundo.clone().project(camara);

        if (vNDC.z < 1) {
          f.el.style.left = ((vNDC.x * 0.5 + 0.5) * window.innerWidth) + 'px';
          f.el.style.top  = ((-vNDC.y * 0.5 + 0.5) * window.innerHeight) + 'px';
          const op = Math.max(0.35, Math.min(1, 1 - (dist - 30) / 80));
          f.el.style.opacity = op;
        } else {
          f.el.style.opacity = 0;
        }
      });

      // ========================================================
      //  FRASE DENTRO DEL CORAZÓN
      //  → posición Y tamaño escalan con el corazón al hacer zoom
      // ========================================================
      const vCentro = puntoCorazon.clone().project(camara);
      const vTop    = puntoCorazonTop.clone().project(camara);

      if (vCentro.z < 1) {
        // Posición en pantalla del centro del corazón
        const sx = (vCentro.x * 0.5 + 0.5) * window.innerWidth;
        const sy = (-vCentro.y * 0.5 + 0.5) * window.innerHeight;

        // Posición en pantalla de la parte superior del corazón
        const syTop = (-vTop.y * 0.5 + 0.5) * window.innerHeight;

        // Altura aparente del corazón en píxeles
        const altoPx = Math.abs(sy - syTop);

        // Tamaño de fuente proporcional (20 % de la altura del corazón)
        const fontSize = Math.max(8, altoPx * 0.20);
        const maxAncho = Math.max(60, altoPx * 1.35);

        elFraseCorazon.style.left = sx + 'px';
        elFraseCorazon.style.top  = sy + 'px';
        elFraseCorazon.style.fontSize = fontSize + 'px';
        elFraseCorazon.style.maxWidth = maxAncho + 'px';

        // Si el corazón se ve muy chico, ocultar el texto
        elFraseCorazon.style.visibility = altoPx < 30 ? 'hidden' : 'visible';
      } else {
        elFraseCorazon.style.visibility = 'hidden';
      }
    }

    controls.update();
    renderer.render(escena, camara);
  }
  animar();

  // ============================================================
  //  RESIZE
  // ============================================================
  window.addEventListener('resize', () => {
    camara.aspect = window.innerWidth / window.innerHeight;
    camara.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  });

})();
</script>
</body>
</html>
